<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід в адмін-панель</title>
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #1f2124;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h2 { margin: 0 0 8px; font-size: 18px; }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #1f2124;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .flash { color: #dc2626; font-size: 13px; margin: 0; }
    </style>
</head>
<body>
    <form method="post">
        <h2>Вхід для адміністратора</h2>
        {% with messages = get_flashed_messages() %}
            {% for m in messages %}
                <p class="flash">{{ m }}</p>
            {% endfor %}
        {% endwith %}
        <input type="text" name="username" placeholder="Логін" required autofocus>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Увійти</button>
    </form>
</body>
</html>
