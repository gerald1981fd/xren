<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f7f7f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #1f2124;
        }
        form {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        h2 { margin: 0 0 8px; font-size: 18px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button {
            padding: 10px; border: none; border-radius: 6px;
            background: #16a34a; color: #fff; font-weight: 600; cursor: pointer;
        }
        .flash { color: #dc2626; font-size: 13px; margin: 0; }
        .alt { font-size: 13px; text-align: center; margin: 0; }
        .alt a { color: #2563eb; }
    </style>
</head>
<body>
    <form method="post">
        <h2>Реєстрація покупця</h2>
        {% with messages = get_flashed_messages() %}
            {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
        {% endwith %}
        <input type="text" name="name" placeholder="Ім'я" value="{{ name }}" required autofocus>
        <input type="email" name="email" placeholder="Email" value="{{ email }}" required>
        <input type="tel" name="phone" placeholder="Телефон" value="{{ phone }}" required>
        <input type="password" name="password" placeholder="Пароль (мін. 6 символів)" minlength="6" required>
        <input type="password" name="password2" placeholder="Повторіть пароль" minlength="6" required>
        <button type="submit">Зареєструватися</button>
        <p class="alt">Вже є акаунт? <a href="{{ url_for('customer_login', next=request.args.get('next')) }}">Увійти</a></p>
        <p class="alt"><a href="{{ url_for('index') }}">← До каталогу</a></p>
    </form>
</body>
</html>
