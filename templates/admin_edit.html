<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування товару</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f7f7f8; margin: 0; color: #1f2124; }
        header { background: #1f2124; color: #fff; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-size: 14px; }
        main { max-width: 600px; margin: 0 auto; padding: 24px; }
        .flash { background: #fef3c7; border: 1px solid #fbbf24; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
        .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        label { font-size: 12px; color: #666; display: block; margin: 12px 0 4px; }
        input, textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; }
        button.primary {
            margin-top: 16px; padding: 10px 18px; border: none; border-radius: 6px;
            background: #16a34a; color: #fff; font-weight: 600; cursor: pointer;
        }
        img.preview { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <header>
        <h1 style="margin:0;font-size:20px;">Редагування товару</h1>
        <a href="{{ url_for('admin_panel') }}">← До списку</a>
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% for m in messages %}
                <div class="flash">{{ m }}</div>
            {% endfor %}
        {% endwith %}

        <div class="panel">
            <form method="post">
                <label>Назва</label>
                <input type="text" name="name" value="{{ product.name }}" required>

                <label>Опис</label>
                <textarea name="description">{{ product.description or '' }}</textarea>

                <label>Ціна, грн</label>
                <input type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required>

                <label>Знижка, %</label>
                <input type="number" step="0.01" min="0" max="100" name="discount_percent" value="{{ product.discount_percent }}">

                <label>URL фото</label>
                <input type="url" name="image_url" value="{{ product.image_url or '' }}" placeholder="https://...">
                {% if product.image_url %}
                    <img class="preview" src="{{ product.image_url }}" alt="">
                {% endif %}

                <button type="submit" class="primary">Зберегти зміни</button>
            </form>
        </div>
    </main>
</body>
</html>
